<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dota Spyfall</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#eee;font-family:system-ui;min-height:100vh}main{max-width:720px;margin:auto;padding:28px 16px}.card{background:#151920;border:1px solid #343a46;border-radius:18px;padding:20px;margin:14px 0}.logo{font-size:28px;font-weight:900;letter-spacing:.08em}.muted{color:#9aa3b2}input,button{width:100%;padding:13px;border-radius:11px;font:inherit;margin-top:8px}input{background:#0d1015;color:#fff;border:1px solid #3b424e}button{border:0;background:#d7a33a;font-weight:800;cursor:pointer}.secondary{background:#303744;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.code{font-size:30px;font-weight:900;text-align:center;letter-spacing:.15em;background:#0d1015;padding:14px;border-radius:11px;margin-top:10px}.player{display:flex;justify-content:space-between;background:#0d1015;border-radius:9px;padding:10px;margin-top:7px}.hidden{display:none}.role{text-align:center;min-height:270px;display:flex;flex-direction:column;justify-content:center}.big{font-size:44px;font-weight:950}.hero{font-size:36px;font-weight:950;margin:10px 0}.err{color:#ff8f8f;margin-top:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
</style></head><body><main>
<div class="logo">DOTA SPYFALL</div><p class="muted">Один герой. Один шпион. Без ведущего.</p>
<section id="home" class="card"><label>Имя</label><input id="name" placeholder="Твоё имя"><div class="row"><button onclick="create()">Создать комнату</button><button class="secondary" onclick="joinBox.classList.remove('hidden')">Войти</button></div><div id="joinBox" class="hidden"><input id="code" placeholder="Код комнаты"><button onclick="join()">Подключиться</button></div><div id="err" class="err"></div></section>
<section id="lobby" class="card hidden"><div class="muted">Код комнаты</div><div id="room" class="code"></div><p class="muted">Отправь код друзьям в Discord.</p><div id="players"></div><button id="start" onclick="start()">Начать раунд</button></section>
<section id="game" class="card hidden"><div class="role"><div class="muted">Твоя секретная карточка</div><div id="big" class="big"></div><div id="hero" class="hero"></div><div id="hint" class="muted"></div></div><button class="secondary" onclick="nextRound()">Новый раунд</button></section>
<section class="card muted">Трое игроков получают одного героя Dota 2, один получает только «ШПИОН». Герой не раскрывается шпиону. Все заходят со своих устройств.</section>
</main>
<script>
let ws;
const $=x=>document.getElementById(x);
function conn(fn){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=fn;ws.onmessage=e=>msg(JSON.parse(e.data));ws.onerror=()=>{$('err').textContent='Ошибка соединения'}};
function create(){conn(()=>ws.send(JSON.stringify({type:'create',name:$('name').value||'Игрок'})))}
function join(){conn(()=>ws.send(JSON.stringify({type:'join',name:$('name').value||'Игрок',code:$('code').value})))}
function start(){ws.send(JSON.stringify({type:'start'}))}
function nextRound(){ws.send(JSON.stringify({type:'newRound'}))}
function msg(m){if(m.type==='error')return $('err').textContent=m.message;if(m.type==='joined'){$('home').classList.add('hidden');$('lobby').classList.remove('hidden');$('room').textContent=m.code;draw(m.players)}
if(m.type==='state'){draw(m.players);if(m.started){$('lobby').classList.add('hidden');$('game').classList.remove('hidden')}else{$('game').classList.add('hidden');$('lobby').classList.remove('hidden')}}
if(m.type==='role'){$('lobby').classList.add('hidden');$('game').classList.remove('hidden');if(m.role==='spy'){$('big').textContent='🕵️ ШПИОН';$('hero').textContent='';$('hint').textContent='Ты не знаешь героя. Слушай подсказки и угадывай.'}else{$('big').textContent='⚔️ ИГРОК';$('hero').textContent=m.hero;$('hint').textContent='Не называй героя напрямую — давай аккуратную подсказку.'}}}
function draw(ps){$('players').innerHTML=ps.map((p,i)=>'<div class="player"><span>'+ (i+1)+'. '+p.name.replace(/[&<>]/g,'')+'</span><span>●</span></div>').join('');$('start').disabled=ps.length<3;$('start').textContent=ps.length<3?'Нужно минимум 3 игрока':'Начать раунд'}
</script></body></html>
